name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # basic-pitch (and TensorFlow with it) is deliberately NOT installed: the
      # runtime imports it lazily and every test uses a fake transcriber.
      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .
          python -m pip install "pytest>=8" "pytest-bdd>=7" "mypy>=1.10" "ruff>=0.5"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Type-check (mypy --strict)
        run: mypy

      - name: Test
        run: pytest -q
