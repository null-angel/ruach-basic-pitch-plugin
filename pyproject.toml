[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruach-basic-pitch"
version = "0.1.0"
description = "Ruach Studio Refiner plugin: transcribe a take's stems to MIDI with Basic Pitch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["basic-pitch>=0.4.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-bdd>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
